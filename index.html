<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ryno-Tec Business Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a1a'/%3E%3Csvg x='7' y='7' width='50' height='50' viewBox='50 -10 320 320'%3E%3Cpath d='M80 300 V80 H200 L240 120 V190 L200 230 H80' fill='none' stroke='%23ffffff' stroke-width='46'/%3E%3Cpath d='M155 230 L340 280' fill='none' stroke='%23ffffff' stroke-width='46'/%3E%3Cpath d='M254.1 226.4 L341.1 249.2' fill='none' stroke='%23ff6b35' stroke-width='40'/%3E%3Cpolygon points='313.6,245.9 351.2,136.4 347.6,134.6 281.6,229.7' fill='%23ff6b35'/%3E%3C/svg%3E%3C/svg%3E">
<style>
/* Layout: dark brand rail (matches site header) + light working area (matches site's #f5f5f5 sections), white cards. */
:root{
  --rail:#1a1a1a;--rail-2:#2d2d2d;--rail-ink:#e2e8f0;--rail-muted:#9aa0a6;--rail-line:#333333;
  --bg:#f5f5f5;--surface:#ffffff;--sunk:#ececec;--ink:#1a1a1a;--text:#333333;--muted:#666666;--line:#e0e0e0;
  --accent:#ff6b35;--accent-hover:#e55a1f;--accent-ink:#c4471a;--accent-soft:#fff0ea;--on-accent:#1a1a1a;
  --good:#2e7d4f;--warn:#a86400;--bad:#c0392b;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --rail:#141414;--rail-2:#262626;--rail-line:#333333;
    --bg:#1a1a1a;--surface:#2d2d2d;--sunk:#242424;--ink:#ffffff;--text:#e6e6e6;--muted:#b0b0b0;--line:#404040;
    --accent-ink:#ff8a5c;--accent-soft:#3a2a22;
    --good:#5fbf8a;--warn:#f0b44c;--bad:#ff6b6b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --rail:#141414;--rail-2:#262626;--rail-line:#333333;
  --bg:#1a1a1a;--surface:#2d2d2d;--sunk:#242424;--ink:#ffffff;--text:#e6e6e6;--muted:#b0b0b0;--line:#404040;
  --accent-ink:#ff8a5c;--accent-soft:#3a2a22;
  --good:#5fbf8a;--warn:#f0b44c;--bad:#ff6b6b;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.6 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* rail — same treatment as the website header */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail);color:var(--rail-ink);
  padding:22px 14px 18px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px;color:#fff;text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:0;line-height:1.15}
.brand small{display:block;font-size:12.5px;font-weight:400;color:var(--rail-muted);letter-spacing:.2px}
.navgroup+.navgroup{margin-top:12px}
.navgroup h3{font-size:11.5px;font-weight:600;color:var(--rail-muted);margin:0 0 4px 10px;text-transform:uppercase;letter-spacing:.6px}
.navgroup a{display:block;padding:7px 10px;border-radius:4px;text-decoration:none;color:var(--rail-ink);font-size:14.5px;transition:color .2s,background .2s}
.navgroup a:hover{color:var(--accent);background:var(--rail-2)}
.navgroup a[aria-current="page"]{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.links{display:flex;flex-direction:column;gap:2px;margin:0 0 -4px}
.site{display:block;padding:5px 10px;font-size:13.5px;color:var(--rail-ink);text-decoration:none;border-radius:4px}
.site:hover{color:var(--accent)}
.sync{margin-top:auto;font-size:12.5px;color:var(--rail-muted);display:flex;gap:8px;align-items:flex-start;padding:0 6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#f0b44c;margin-top:6px;flex:none}
.sync.on i{background:#5fbf8a}
.mbar{display:none}
main{padding:32px clamp(16px,4vw,48px) 64px;max-width:1400px;width:100%}

/* page heads */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:30px;line-height:1.15;letter-spacing:-.5px;margin:0;color:var(--ink);font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;max-width:64ch}
h2{font-size:18px;letter-spacing:-.2px;margin:0;color:var(--ink);font-weight:600}

.btn{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:4px;padding:9px 16px;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:border-color .2s,background .2s,transform .2s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:6px 11px;font-size:13.5px}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* toolbar */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 220px;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.toolbar input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,107,53,.15)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 11px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;opacity:.6;margin-left:5px}

/* tables */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--accent-soft)}
td.primary{font-weight:600;color:var(--ink)}
.num{text-align:right;white-space:nowrap}
.late{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.badge.good::before{background:var(--good)}
.badge.warn::before{background:var(--warn)}
.badge.bad::before{background:var(--bad)}
.badge.bad{color:var(--bad);font-weight:600}

.empty{border:1px dashed var(--line);border-radius:6px;padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty p{margin:0 0 12px}

/* dashboard hero — same dark gradient as the website hero */
.hero{background:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%);color:#fff;border-radius:6px;padding:28px clamp(20px,3vw,36px) 30px;margin-bottom:24px;border:1px solid #333}
.hero h1{color:#cfd3d8;font-size:15px;font-weight:500;letter-spacing:.2px}
.hero .headline{color:#fff;margin:10px 0 0}
.hero .btn{background:transparent;color:#fff;border:2px solid #fff}
.hero .btn:hover{background:rgba(255,255,255,.1);border-color:#fff}
.hero .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.headline{font-size:clamp(22px,3.2vw,34px);line-height:1.25;letter-spacing:-.5px;font-weight:700;max-width:26ch;margin:4px 0 28px;color:var(--ink)}
.headline .q{color:var(--accent)}
.headline .bad{color:#ff8a6b}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:28px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat strong{display:block;font-size:24px;letter-spacing:-.5px;margin-top:4px;color:var(--ink)}
.stat em{font-style:normal;font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px}
.panel h2{margin-bottom:10px}
.panel+.panel{margin-top:28px}
.attn{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.attn li{border-bottom:1px solid var(--line)}
.attn li:last-child{border-bottom:0}
.attn button{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:12px 14px;cursor:pointer;color:var(--text)}
.attn button:hover{background:var(--accent-soft)}
.attn button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.attn .why{font-size:13px;color:var(--muted);margin-left:auto;text-align:right;white-space:nowrap}
.attn .tag{flex:none;width:4px;border-radius:2px;background:var(--warn)}
.attn .tag.bad{background:var(--bad)}
.clear{padding:14px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.money{display:grid;grid-template-columns:1fr auto;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:16px 18px;margin:0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.money dt{color:var(--muted)}
.money dd{margin:0;text-align:right;font-weight:600;color:var(--ink)}
.money .total{border-top:1px solid var(--line);padding-top:8px}
.meter{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.lane{background:var(--sunk);border-radius:6px;padding:10px;min-height:120px}
.lane header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px}
.lane header b{font-size:14px;color:var(--ink)}
.lane header span{font-size:12.5px;color:var(--muted)}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin-bottom:8px;cursor:pointer;color:var(--text);transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card b{display:block;font-weight:600;color:var(--ink)}
.card small{display:block;color:var(--muted);font-size:13px}
.card .v{margin-top:6px;font-weight:600;color:var(--ink)}

/* project */
.crumb{font-size:14px;margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.scope{white-space:pre-wrap;max-width:70ch;color:var(--muted);margin:8px 0 0}

/* dialog — same as the Business Hub login card */
dialog{border:1px solid var(--line);border-radius:8px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--text);box-shadow:0 15px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,10,10,.6)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%);color:#fff;border-radius:7px 7px 0 0}
.dhead h2{color:#fff}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:#cfd3d8;padding:4px 8px}
.x:hover{color:var(--accent)}
.fields{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:var(--ink)}
.f label i{font-style:normal;color:var(--bad)}
.f input,.f select,.f textarea{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);width:100%;transition:border-color .2s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,107,53,.15)}
.f textarea{min-height:92px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--muted)}
.check{flex-direction:row;align-items:center;gap:9px;padding-top:24px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.dfoot{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.spacer{flex:1}
.meta{font-size:12.5px;color:var(--muted)}

#viewer{width:min(960px,calc(100vw - 24px));height:calc(100vh - 48px);max-height:none}
#viewer .vwrap{display:flex;flex-direction:column;height:100%}
#viewer .vbody{flex:1;min-height:0;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:auto}
#viewer .vbody .pages{align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;width:100%}
#viewer .vbody canvas{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:100%;height:auto}
#viewer .vbody img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .vbody p{padding:24px;text-align:center;color:var(--muted);max-width:46ch}
@media (max-width:640px){#viewer{width:100vw;height:100%;max-width:100vw;margin:0;border-radius:0;border:0}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1a1a1a;color:#fff;border-left:4px solid var(--accent);padding:10px 16px;border-radius:4px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);z-index:40}
#toast.show{opacity:1}

/* responsive */
@media (max-width:980px){.cols{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;
    background:var(--rail);color:#fff;border-bottom:1px solid var(--rail-line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .mbar .brand{margin:0}
  .mbar .brand svg{width:30px;height:30px}
  .mbar #mtitle{color:var(--rail-muted);font-size:13px}
  .mbar .btn{background:transparent;color:#fff;border-color:#555}
  .mbar .btn:hover{border-color:var(--accent)}
  .rail{position:fixed;inset:0;z-index:30;height:100%;transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw);
    padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .scrim{position:fixed;inset:0;background:rgba(10,10,10,.6);z-index:25;display:none}
  .scrim.open{display:block}
  main{padding-top:20px}
}
@media (max-width:640px){
  .fields{grid-template-columns:1fr}
  .check{padding-top:0}
  dialog{width:100vw;max-width:100vw;height:100%;max-height:100%;border-radius:0;margin:0;border:0}
  dialog form{height:100%;max-height:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dhead{border-radius:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .fields{flex:1}
  .tablewrap{background:transparent;border:0;overflow:visible;box-shadow:none}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tbody tr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;margin-bottom:10px}
  td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:16px}
  td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  td.primary{font-size:16px;padding-bottom:6px}
  td.primary::before{content:none}
  .num{text-align:right}
  .stat{border-right:0;border-bottom:1px solid var(--line)}
  .bar{grid-template-columns:84px minmax(0,1fr) auto}
  .hero{padding:22px 18px}
}

/* mail */
.msearch{flex:1 1 220px;max-width:340px;margin:0}
.msearch input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.msearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,107,53,.15)}
.maillist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.maillist li{border-bottom:1px solid var(--line)}
.maillist li:last-child{border-bottom:0}
.maillist a{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:14px;padding:12px 16px;color:var(--text);text-decoration:none;align-items:baseline}
.maillist a:hover{background:var(--accent-soft)}
.maillist a.unread{box-shadow:inset 3px 0 0 var(--accent)}
.maillist a.unread .who,.maillist a.unread .what b{color:var(--ink);font-weight:700}
.maillist .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.maillist .who i{font-style:normal;color:var(--muted);font-size:12.5px}
.maillist .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maillist .what b{font-weight:600;margin-right:8px}
.maillist .snip{color:var(--muted)}
.maillist .when{font-size:13px;color:var(--muted);white-space:nowrap}
.cchip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent-ink);margin-right:8px;vertical-align:1px}
.note-box{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:12px 16px}
.note-box summary{cursor:pointer;font-weight:600;color:var(--ink)}
.note-box ol{margin:10px 0 0;padding-left:20px;color:var(--text)}
.note-box li{margin:4px 0}
.warn-text{color:var(--warn)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.thread{display:grid;gap:12px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0}
.msg header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.msg b{color:var(--ink)}
.small{font-size:12.5px}
.mbody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.6}
.msg details summary{cursor:pointer;color:var(--accent-ink);font-weight:600}
.reply{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:16px 18px}
.reply h2{margin-bottom:10px}
.reply textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);resize:vertical;min-height:160px}
.reply textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,107,53,.15)}
.reply textarea[aria-busy="true"]{border-color:var(--accent)}
.reply-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.inline{display:inline-flex;gap:7px;align-items:center;font-size:14px}
.inline input{accent-color:var(--accent);width:16px;height:16px}
/* quotes */
dialog.wide{width:min(940px,calc(100vw - 24px))}
.qitems-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
.qitems{width:100%;border-collapse:collapse;min-width:620px}
.qitems th{background:var(--sunk);font-size:11.5px;padding:8px}
.qitems td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.qitems tr:last-child td{border-bottom:0}
.qitems tbody tr{cursor:default}
.qitems tbody tr:hover{background:transparent}
.qitems input,.qitems select,.qitems textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:14px}
.qitems textarea{resize:none;overflow:hidden;min-height:36px;line-height:1.4}
.qitems td:nth-child(1){width:46%}.qitems td:nth-child(2){width:9%}.qitems td:nth-child(3){width:14%}.qitems td:nth-child(4){width:14%}
.qitems td[data-amt]{padding-top:13px;font-weight:600;color:var(--ink)}
.qitems .x{padding:6px 8px}
.qitems .x:disabled{opacity:.3;cursor:default}
.qitems input:focus,.qitems select:focus,.qitems textarea:focus{outline:none;border-color:var(--accent)}
.qfoot{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:10px;flex-wrap:wrap}
.qtot{display:grid;grid-template-columns:auto auto;gap:4px 24px;margin:0;min-width:220px}
.qtot dt{color:var(--muted);text-align:right}
.qtot dd{margin:0;text-align:right;font-weight:600;color:var(--ink)}
.qtot .total{border-top:2px solid var(--accent);padding-top:6px;font-size:17px;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.details{grid-template-columns:200px 1fr}
.details dd{text-align:left;font-weight:500;white-space:pre-line}
@media (max-width:720px){
  .maillist a{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
  .maillist .what{grid-column:1/-1;white-space:normal}
  .maillist .snip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .details{grid-template-columns:1fr}
  .details dd{margin-bottom:8px}
}
.attn .tag.ok{background:var(--good)}
.attn .dl{display:flex;gap:12px;padding:12px 14px}
.attn .dl > span:nth-child(2){display:flex;flex-direction:column;gap:2px;min-width:0}
.docs li{padding:0}
.docrow{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:default}
.docrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.docrow .nofile{width:18px;flex:none}
.docrow .dname{display:flex;flex-direction:column;min-width:0;flex:1}
.docrow .dname b{color:var(--ink);font-weight:600}
.packbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.fstate{font-size:14px}
.f input[type=file]{padding:8px;background:var(--surface)}
.sigprev,.sigcard{background:#ffffff;color:#222222;border:1px solid var(--line);border-radius:6px;padding:4px 16px 14px;overflow-x:auto}
.sigcard{margin-top:6px}
.sigpanel{margin-top:28px}
.reply-sig{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.sigbox summary{cursor:pointer;color:var(--accent-ink);font-weight:600;font-size:13.5px}
.sigbox .sigprev{margin-top:8px}
.sigline{padding-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* company switch */
.coswitch{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--rail-2);border-radius:6px;padding:3px;margin-top:-6px}
.coswitch button{background:none;border:0;border-radius:4px;padding:7px 6px;color:var(--rail-muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.coswitch button:hover{color:var(--rail-ink)}
.coswitch button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
:root[data-company="llp"]{--rail:#0E3D24;--rail-2:#185332;--rail-ink:#EAF5EC;--rail-muted:#9ED6B0;--rail-line:#1B5A35;--accent:#E2622A;--accent-hover:#C9531F;--accent-ink:#C24E17;--accent-soft:#FCEBE1;--on-accent:#FFFFFF;--hero-a:#FFFFFF;--hero-b:#E3F2E7;--hero-ink:#0E3D24;--hero-muted:#3F5A47}
@media (prefers-color-scheme:dark){:root[data-company="llp"]:not([data-theme="light"]){--rail:#082A18;--rail-2:#123A25;--rail-line:#1A4A30;--accent-ink:#FF8A4C;--accent-soft:#3A2418;--hero-a:#0F2A1C;--hero-b:#14402A;--hero-ink:#F2F8F3;--hero-muted:#B9D6C2}}
:root[data-company="llp"][data-theme="dark"]{--rail:#082A18;--rail-2:#123A25;--rail-line:#1A4A30;--accent-ink:#FF8A4C;--accent-soft:#3A2418;--hero-a:#0F2A1C;--hero-b:#14402A;--hero-ink:#F2F8F3;--hero-muted:#B9D6C2}
:root[data-company="llp"] .hero{background:linear-gradient(160deg,var(--hero-a) 0%,var(--hero-b) 100%);border-color:var(--line)}
:root[data-company="llp"] .hero h1{color:var(--hero-muted)}
:root[data-company="llp"] .hero .headline{color:var(--hero-ink)}
:root[data-company="llp"] .hero .btn{color:var(--hero-ink);border-color:var(--hero-ink);background:transparent}
:root[data-company="llp"] .hero .btn:hover{background:rgba(127,212,156,.18)}
:root[data-company="llp"] .hero .btn.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
:root[data-company="llp"] .dhead{background:linear-gradient(135deg,#0E3D24 0%,#1B6B3D 100%)}
:root[data-company="llp"] #toast{background:#0E3D24}
#m365gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg,#f4f4f4);padding:16px}
#m365gate .m365card{max-width:420px;width:100%;background:var(--panel,#fff);border:1px solid var(--line,#ddd);border-radius:10px;padding:28px;text-align:center}
#m365gate h1{font-size:1.4rem;margin:0 0 8px}#m365gate p{margin:0 0 20px;color:var(--muted,#666)}
#m365who{margin:12px 0 0;word-break:break-all}
html.m365 .reply-sig,html.m365 .sigline,html.m365 .sigprev{display:none}
</style>
</head>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ZAR = new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:0});
const money = v => (v === '' || v == null || isNaN(+v)) ? '—' : ZAR.format(+v);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const thisMonth = () => today().slice(0,7);
const addDays = (s,n) => { const d = new Date(s+'T00:00'); d.setDate(d.getDate()+n); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmtDate = s => s ? new Date(s+'T00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtMonth = s => s ? new Date(s+'-01T00:00').toLocaleDateString('en-ZA',{month:'long',year:'numeric'}) : '—';
const daysUntil = s => Math.round((new Date(s+'T00:00') - new Date(today()+'T00:00'))/864e5);
const sum = (arr, f) => arr.reduce((a,x) => a + (+f(x) || 0), 0);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'');

/* ---------- companies ---------- */
const COMPANIES = {
  rtc: {id:'rtc', short:'Ryno-Tec', site:'https://www.ryno-tec.co.za', tn:'IT tender', unit:'hours', prefix:'', defView:'online',
    dark:[26,26,26], accent:[255,107,53], darkHex:'#1a1a1a', accentHex:'#ff6b35', inkHex:'#c4471a',
    blurb:'IT tenders with an online briefing',
    about:'a South African IT consulting firm (platform engineering, Azure modern workplace, cloud infrastructure, identity and security, AI infrastructure)',
    services:['Platform engineering','Modern workplace','Cloud infrastructure','Identity & security','AI infrastructure','EV charging','Managed services','Other'],
    mark:'<svg viewBox="50 -10 320 320" aria-hidden="true"><path d="M80 300 V80 H200 L240 120 V190 L200 230 H80" fill="none" stroke="currentColor" stroke-width="40" stroke-linejoin="miter"/><path d="M155 230 L340 280" fill="none" stroke="currentColor" stroke-width="40"/><path d="M146 12 H96 V60 H146" fill="none" stroke="currentColor" stroke-width="28" stroke-linejoin="miter"/><path d="M254.1 226.4 L341.1 249.2" fill="none" stroke="#ff6b35" stroke-width="34"/><polygon points="313.6,245.9 351.2,136.4 347.6,134.6 281.6,229.7" fill="#ff6b35"/></svg>', logo:null},
  llp: {id:'llp', short:'Lesego Laka', site:'https://www.lesegolakaprojects.com', tn:'tender', unit:'each', prefix:'LL-', defView:'open',
    dark:[14,61,36], accent:[226,98,42], darkHex:'#0E3D24', accentHex:'#E2622A', inkHex:'#C24E17',
    blurb:'Maintenance, grounds, agriculture and supply tenders',
    about:'a South African facilities and agricultural services company (building maintenance such as painting and paving, grounds and landscaping, livestock and crop farming, and supply of non-IT goods such as PPE and cleaning materials), mainly bidding for public-sector work in Gauteng',
    services:['Facilities maintenance','Grounds & landscaping','Agriculture','Supply & procurement','Other'],
    mark:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 8h13v35h35v13H8z" fill="#7FD49C"/><path d="M56 56H43V21H8V8h48z" fill="#E2622A"/><path d="M32 40V28m0 0c-4 0-6-2.6-6-6.4 4 0 6 2.6 6 6.4zm0 4c3.6 0 5.6-2.2 5.6-5.6-3.6 0-5.6 2.2-5.6 5.6z" fill="none" stroke="#7FD49C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>', logo:'<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-4 -4 72 72"><path d="M8 8h13v35h35v13H8z" fill="#7FD49C"/><path d="M56 56H43V21H8V8h48z" fill="#E2622A"/><path d="M32 40V28m0 0c-4 0-6-2.6-6-6.4 4 0 6 2.6 6 6.4zm0 4c3.6 0 5.6-2.2 5.6-5.6-3.6 0-5.6 2.2-5.6 5.6z" fill="none" stroke="#7FD49C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
};
let CO = (() => { try { const v = localStorage.getItem('hub-company'); return COMPANIES[v] ? v : 'rtc'; } catch(e){ return 'rtc'; } })();
const C = () => COMPANIES[CO];
const coOf = r => (r && r.company) || 'rtc';
const tn = () => C().tn;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- schema ---------- */
const STAGES = ['Lead','Qualified','Proposal','Negotiation','Won','Lost'];
const STAGE_P = {Lead:10,Qualified:25,Proposal:50,Negotiation:75,Won:100,Lost:0};
const TONE = {
  good:['Active','Won','Paid','Signed','Done','Verified','Agreed','Complete','Built','Awarded','Valid','Online','Online and in person','Accepted'],
  warn:['Proposal','Negotiation','With lawyer','With counterparty','Ready to sign','In progress','In review','On hold','Trial','Sent','Planning','Reviewing','Bidding','Submitted','Expiring'],
  bad:['Lost','Overdue','Expired','Terminated','Cancelled','Rejected','Blocked','Declined']
};
const tone = v => TONE.good.includes(v) ? 'good' : TONE.warn.includes(v) ? 'warn' : TONE.bad.includes(v) ? 'bad' : '';

/* tender matching */
const IT_RE = /\b(ict|i\.c\.t|information technology|information and communication|it services?|it support|it equipment|it infrastructure|software|hardware|computer|laptops?|desktops?|servers?|storage area|cloud|data ?cent(?:re|er)s?|cyber|firewall|microsoft|licen[cs](?:e|es|ing)|end[- ]user computing|help ?desk|service desk|erp|sap|oracle|azure|aws|lan|wan|wi-?fi|network (?:infrastructure|equipment|switch|security|cabling)|telephony|voip|website|web ?development|web ?portal|database|backup|disaster recovery|systems? integration|digital transformation|it managed services|managed it|printing solution|active directory|intune|m365|office 365)\b/i;
const LLP_RE = /\b(maintenance|repairs?|refurbish\w*|renovat\w*|painting|paint|paving|pavers?|kerb\w*|plumbing|roof\w*|gutters?|fenc\w*|building works?|minor works|civil works|cleaning services?|cleaning materials?|cleaning chemicals?|hygiene|landscap\w*|grass cutting|grass|lawns?|garden\w*|horticultur\w*|tree felling|tree pruning|bush clearing|alien (?:vegetation|invasive\w*)|vegetation|weed\w*|agricultur\w*|farm\w*|livestock|cattle|goats?|sheep|pigs?|poultry|broilers?|fodder|animal feed|seedlings?|seeds|fertili[sz]er\w*|fresh produce|vegetables?|food parcels?|ppe|protective clothing|workwear|uniforms?|overalls|consumables|stationery|lease of (?:land|farm\w*)|land lease)\b/i;
const tenderRe = () => CO === 'llp' ? LLP_RE : IT_RE;
const ONLINE_RE = /(ms |microsoft )?teams\b|zoom|virtual|online|webinar|google meet|meet\.google|webex|link will be|via (?:a )?link|https?:\/\//i;
const CORE_DOCS = ['CIPC registration','Tax compliance status (TCS PIN)','CSD registration','B-BBEE affidavit or certificate'];
const COMPLIANCE_DOCS = [...CORE_DOCS,'SARS registration notice','Memorandum of Incorporation (MOI)','CIPC notice of incorporation','COIDA letter of good standing','Professional indemnity insurance','Bank confirmation letter','Municipal rates clearance','Company profile','Director ID copies','Other'];
const nowLocal = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
const fmtDT = s => s ? new Date(s).toLocaleString('en-ZA',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const isOpenTender = t => !['Submitted','Awarded','Lost','Not bidding'].includes(t.status) && (!t.closing || t.closing >= nowLocal());
const isOnline = t => /Online/.test(t.briefing || '');
const ARCHIVE_CATS = ['CIPC','SARS','CSD','B-BBEE','Banking','Microsoft','Domain & hosting','Tenders','Clients & suppliers','Other'];
function archFiles(m){
  const fs = [...(m.attachments || []), ...(fileOf(m) ? [fileOf(m)] : [])];
  if (!fs.length) return '<span class="muted">—</span>';
  return viewBtn(fs[0], fs.length > 1 ? `Open (${fs.length})` : 'Open', 'link');
}
function guessCat(from, subj){
  const f = String(from || '').toLowerCase(), s = String(subj || '').toLowerCase();
  if (/b-?bbee/.test(s)) return 'B-BBEE';
  if (/cipc\./.test(f)) return 'CIPC';
  if (/sars\./.test(f)) return 'SARS';
  if (/csd\./.test(f)) return 'CSD';
  if (/nedbank|fnb\.|absa\.|standardbank|capitecbank|simplybiz/.test(f)) return 'Banking';
  if (/microsoft/.test(f)) return 'Microsoft';
  if (/afrihost|registry\.net\.za|aserv/.test(f)) return 'Domain & hosting';
  if (/etender|treasury/.test(f)) return 'Tenders';
  return 'Other';
}
function docStatus(c){
  if (!c.expires) return 'No expiry';
  const d = daysUntil(c.expires);
  return d < 0 ? 'Expired' : d <= 30 ? 'Expiring' : 'Valid';
}
function briefCell(t){
  const b = t.briefing || 'Not stated';
  const when = t.briefingAt ? `<br><span class="muted">${esc(fmtDT(t.briefingAt))}${t.compulsory ? ', compulsory' : ''}</span>` : (t.compulsory ? '<br><span class="muted">Compulsory</span>' : '');
  return `<span>${['Online','Online and in person'].includes(b) ? badge(b) : esc(b)}${when}</span>`;
}

const SCHEMA = {
  tenders:{label:'Tenders',one:'tender',title:t=>t.title,sort:(a,b)=>(a.closing||'9').localeCompare(b.closing||'9'),status:'status',
    get desc(){ return `${cap(tn())}s from your tender system, with briefing details and where each bid stands.`; },
    get emptyText(){ return `No ${tn()}s for ${C().short} yet. They arrive with the next morning sync from eTender Pro. To get them now, export from eTender Pro and import the file here.`; },
    fields:[
      {k:'title',l:'Tender',t:'text',req:1,wide:1},
      {k:'tenderNo',l:'Tender number',t:'text'},
      {k:'buyer',l:'Department or entity',t:'text'},
      {k:'province',l:'Province',t:'text'},
      {k:'category',l:'Category',t:'text'},
      {k:'value',l:'Estimated value',t:'money'},
      {k:'closing',l:'Closes',t:'datetime-local'},
      {k:'briefing',l:'Briefing',t:'select',opt:['Online','Online and in person','In person','No briefing','Not stated'],def:'Not stated'},
      {k:'briefingAt',l:'Briefing date and time',t:'datetime-local'},
      {k:'compulsory',l:'Briefing is compulsory',t:'bool'},
      {k:'briefingVenue',l:'Briefing venue or instructions',t:'text',wide:1},
      {k:'briefingLink',l:'Briefing join link',t:'url'},
      {k:'status',l:'Bid status',t:'select',opt:['New','Reviewing','Bidding','Submitted','Awarded','Lost','Not bidding'],def:'New',badge:1},
      {k:'sourceUrl',l:'eTenders link',t:'url'},
      {k:'docsUrl',l:'Bid documents link',t:'url'},
      {k:'ocid',l:'eTenders reference (OCID)',t:'text'},
      {k:'notes',l:'Notes and bid requirements',t:'textarea',wide:1}],
    cols:['title','buyer',{k:'brief',l:'Briefing',v:t=>briefCell(t)},'closing','status']},
  compliance:{label:'Compliance pack',one:'document',title:c=>c.doc,sort:(a,b)=>(a.expires||'9').localeCompare(b.expires||'9'),status:'st',statusOf:c=>docStatus(c),
    chipOpts:['Valid','Expiring','Expired','No expiry'],
    desc:'The documents tenders ask for. Keep them current so you can bid at short notice.',
    fields:[
      {k:'doc',l:'Document',t:'select',opt:COMPLIANCE_DOCS,req:1},
      {k:'reference',l:'Reference or number',t:'text',hint:'e.g. CSD supplier number, TCS PIN'},
      {k:'issued',l:'Issued',t:'date'},{k:'expires',l:'Expires',t:'date'},
      {k:'file',l:'File',t:'asset'},

/* ---------- data ---------- */
const D = {}, RAW = {}; Object.keys(SCHEMA).forEach(k => { D[k] = []; RAW[k] = []; });
function refreshView(k){ (k ? [k] : Object.keys(SCHEMA)).forEach(x => D[x] = RAW[x].filter(r => coOf(r) === CO)); }
let DB = null, MODE = 'pending', SYNC = null;
const LSKEY = 'rynotec-hub-data-v1';
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function loadLocal(){
  try { const raw = localStorage.getItem(LSKEY); if (raw){ const o = JSON.parse(raw); Object.keys(SCHEMA).forEach(k => RAW[k] = Array.isArray(o[k]) ? o[k] : []); } } catch(e){}
  refreshView();
}
function saveLocal(){ lsSet(LSKEY, JSON.stringify(RAW)); }

const get = (k,id) => D[k].find(x => x.id === id);
const refName = (k,id) => { const x = id && get(k,id); return x ? SCHEMA[k].title(x) : '—'; };
const rate = pid => +(get('projects',pid)?.rate) || 0;
const invTotal = i => (+i.amount || 0) * (i.vat ? 1.15 : 1);
const invStatus = i => (i.status === 'Sent' && i.due && i.due < today()) ? 'Overdue' : (i.status || 'Draft');
const dealP = d => (d.probability === '' || d.probability == null) ? STAGE_P[d.stage] ?? 0 : +d.probability;
const statusOf = (k,x) => SCHEMA[k].statusOf ? SCHEMA[k].statusOf(x) : x[SCHEMA[k].status];
function nextInvoiceNo(){
  const y = today().slice(0,4), pre = `${C().prefix}INV-${y}-`;
  const n = D.invoices.map(i => i.number || '').filter(s => s.startsWith(pre)).map(s => +s.slice(pre.length) || 0);
  return pre + String((n.length ? Math.max(...n) : 0) + 1).padStart(3,'0');
}

async function saveItem(k, id, body){
  body.updatedAt = new Date().toISOString();
  if (!id) body.createdAt = body.updatedAt;
  const prev = id ? RAW[k].find(x => x.id === id) : null;
  body.company = body.company || (prev && prev.company) || CO;
  if (MODE === 'db'){
    const ref = id ? DB.collection(k).doc(id) : DB.collection(k).doc();
    if (id){ const old = get(k,id); if (old?.createdAt) body.createdAt = old.createdAt; }
    await ref.set(body);
    return ref.id;
  }
  if (id){ const i = RAW[k].findIndex(x => x.id === id); RAW[k][i] = {...RAW[k][i], ...body, id}; }
  else { id = uid(); RAW[k].push({...body, id}); }
  refreshView(k); saveLocal(); render(); return id;
}
async function deleteItem(k,id){
  if (MODE === 'db'){ await DB.collection(k).doc(id).delete(); return; }
  RAW[k] = RAW[k].filter(x => x.id !== id); refreshView(k); saveLocal(); render();
}
function writeError(e){
  const c = e && e.code;
  if (c === 'invalid_argument') toast("Your access is view-only. Ask the owner to make you an Editor.");
  else if (c === 'quota_exceeded') toast('Storage is full. Delete old records to make room.');
  else toast("Couldn't save. Check your connection and try again.");
}

/* ---------- render: shared ---------- */
const badge = v => v ? `<span class="badge ${tone(v)}">${esc(v)}</span>` : '<span class="muted">—</span>';
function resolveCols(k, only){
  const s = SCHEMA[k];
  return s.cols.map(c => typeof c === 'string' ? {...s.fields.find(f => f.k === c)} : c)
    .filter(c => !only || only(c));
}
function cell(c, r){
  if (c.v) return c.v(r);
  const v = r[c.k];
  switch (c.t){
    case 'money': return money(v);
    case 'date': {
      if (!v) return '<span class="muted">—</span>';
      const done = ['Done','Complete','Paid','Cancelled','Terminated','Won','Lost','Expired','Submitted','Awarded','Not bidding'].includes(statusOf(currentKeyFor(c, r), r));
      const late = (c.k === 'due' || c.k === 'end') && v < today() && !done;
      return `<span class="${late ? 'late' : ''}">${fmtDate(v)}</span>`;
    }
    case 'month': return esc(fmtMonth(v));
    case 'datetime-local': {
      if (!v) return '<span class="muted">—</span>';
      const late = c.k === 'closing' && v < nowLocal() && isOpenTender({...r, closing: '9'});
      return `<span class="${late ? 'late' : ''}">${esc(fmtDT(v))}</span>`;
    }
    case 'ref': return esc(refName(c.ref, v));
    case 'bool': return v ? 'Yes' : 'No';
    case 'number': return v === '' || v == null ? '<span class="muted">—</span>' : esc(v);
    default: return c.badge ? badge(v) : (v ? esc(v) : '<span class="muted">—</span>');
  }
}
let _ck = null; const currentKeyFor = () => _ck;
function table(k, rows, only){
  if (!rows.length) return '';
  const cols = resolveCols(k, only); _ck = k;
  const isNum = c => c.num || c.t === 'money' || c.k === 'hours';
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th class="${isNum(c)?'num':''}" scope="col">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr data-open="${k}:${r.id}" tabindex="0">${cols.map((c,i) => `<td data-label="${esc(c.l)}" class="${isNum(c)?'num':''} ${i===0?'primary':''}">${cell(c,r)}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}
function empty(k, text, prefill){
  const s = SCHEMA[k];
  return `<div class="empty"><p>${esc(text || `No ${s.label.toLowerCase()} yet.`)}</p><button class="btn primary" data-add="${k}" ${prefill ? `data-prefill='${esc(JSON.stringify(prefill))}'` : ''}>Add ${esc(s.one)}</button></div>`;
}

/* ---------- render: list pages ---------- */
function filtered(k){
  const s = SCHEMA[k], st = ui[k];
  let rows = [...D[k]].sort(s.sort);
  if (k === 'tenders' && st.view !== 'all') rows = rows.filter(t => isOpenTender(t) && (st.view !== 'online' || isOnline(t)));
  if (st.status) rows = rows.filter(r => statusOf(k,r) === st.status);
  if (st.q){
    const q = st.q.toLowerCase();
    rows = rows.filter(r => s.fields.some(f => {
      const v = f.t === 'ref' ? refName(f.ref, r[f.k]) : r[f.k];
      return String(v ?? '').toLowerCase().includes(q);
    }));
  }
  return rows;
}
function listBody(k){
  const rows = filtered(k);
  if (!D[k].length) return empty(k, SCHEMA[k].emptyText);
  if (!rows.length) return `<div class="empty"><p>${k === 'tenders' && ui.tenders.view === 'online' && !ui.tenders.q && !ui.tenders.status ? `No open ${tn()}s with an online briefing. Choose All open to see the rest.` : 'Nothing matches. Clear the search or pick another filter.'}</p></div>`;
  return table(k, rows);
}
function renderList(k){
  const s = SCHEMA[k], st = ui[k];
  let chips = '';
  if (s.status){
    const f = s.fields.find(x => x.k === s.status) || {};
    const opts = s.chipOpts ? [...s.chipOpts] : [...f.opt]; if (k === 'invoices') opts.splice(2,0,'Overdue');
    const count = v => D[k].filter(r => statusOf(k,r) === v).length;
    chips = `<div class="chips" role="group" aria-label="Filter by status"><button class="chip" data-filter="${k}:" aria-pressed="${!st.status}">All<b>${D[k].length}</b></button>${
      opts.map(o => { const n = count(o); return n || st.status === o ? `<button class="chip" data-filter="${k}:${esc(o)}" aria-pressed="${st.status===o}">${esc(o)}<b>${n}</b></button>` : ''; }).join('')}</div>`;
  }
  let extra = '';
  if (k === 'timesheets'){
    const m = D.timesheets.filter(t => (t.date||'').startsWith(thisMonth()));
    extra = `<p class="sub">This month: ${sum(m,t=>t.hours)}h logged, ${sum(m.filter(t=>t.billable),t=>t.hours)}h billable.</p>`;
  }
  return `<header class="page-head"><div><h1>${esc(s.label)}</h1><p class="sub">${esc(s.desc)}</p>${extra}</div><button class="btn primary" data-add="${k}">Add ${esc(s.one)}</button></header>
  ${D[k].length ? `<div class="toolbar"><input type="search" placeholder="Search ${esc(s.label.toLowerCase())}" aria-label="Search ${esc(s.label.toLowerCase())}" data-search="${k}" value="${esc(st.q)}">${chips}</div>` : ''}
  <div id="listBody">${listBody(k)}</div>`;
}

/* ---------- render: pipeline ---------- */
function renderPipeline(){
  const s = SCHEMA.deals;
  const open = D.deals.filter(d => !['Won','Lost'].includes(d.stage));
  const weighted = sum(open, d => (+d.value||0) * dealP(d) / 100);
  const lanes = STAGES.map(st => {
    const ds = D.deals.filter(d => (d.stage||'Lead') === st).sort(s.sort);
    return `<section class="lane" aria-label="${st}"><header><b>${st}</b><span>${ds.length} · ${money(sum(ds,d=>d.value))}</span></header>${
      ds.map(d => `<button class="card" data-open="deals:${d.id}"><b>${esc(d.title)}</b><small>${esc(refName('clients',d.client))}</small><div class="v">${money(d.value)}</div><small>${d.close ? 'Close ' + fmtDate(d.close) : 'No close date'}</small></button>`).join('')
    }</section>`;
  }).join('');
  return `<header class="page-head"><div><h1>Pipeline</h1><p class="sub">${plural(open.length,'open deal')} worth ${money(sum(open,d=>d.value))}, or ${money(weighted)} weighted by win chance.</p></div><button class="btn primary" data-add="deals">Add deal</button></header>
  ${D.deals.length ? `<div class="board">${lanes}</div>` : empty('deals','No deals yet. Add the first opportunity you are chasing.')}`;
}

function renderProject(id){
  const p = get('projects', id);
  if (!p) return `<p class="crumb"><a href="#/projects">Projects</a></p><div class="empty"><p>This project was deleted or hasn't loaded yet.</p></div>`;
  const of = k => D[k].filter(x => x.project === id);
  const tasks = of('tasks'), reqs = of('requirements'), time = of('timesheets'), invs = of('invoices').filter(i => i.status !== 'Cancelled'), cons = of('contracts');
  const hrs = sum(time, t => t.hours), billVal = sum(time.filter(t=>t.billable), t => t.hours * (+p.rate||0));
  const invoiced = sum(invs, i => i.amount);
  const done = tasks.filter(t => t.status === 'Done').length;
  const agreed = reqs.filter(r => ['Agreed','Built','Verified'].includes(r.status)).length;
  const used = p.budget ? Math.round(Math.max(billVal, invoiced) / p.budget * 100) : null;
  const tabs = [['tasks','Plan',tasks],['requirements','Requirements',reqs],['timesheets','Time',time],['invoices','Invoices',invs],['contracts','Contracts',cons]];
  const t = tabs.find(x => x[0] === ui.projTab) || tabs[0];
  const k = t[0], rows = [...t[2]].sort(SCHEMA[k].sort);
  return `<p class="crumb"><a href="#/projects">Projects</a></p>
  <header class="page-head"><div><h1>${esc(p.name)}</h1><p class="sub">${esc(refName('clients',p.client))}, ${esc(p.billing||'')}${p.rate ? ' at ' + money(p.rate) + '/h' : ''}. ${badge(p.status)}</p>${p.scope ? `<p class="scope">${esc(p.scope)}</p>` : ''}</div><button class="btn" data-open="projects:${id}" data-edit="1">Edit project</button></header>

const normKey = k => String(k).toLowerCase().replace(/[^a-z0-9]/g,'');
function pick(o, ...keys){
  for (const k of keys){
    let v = k.split('.').reduce((a,p) => a == null ? undefined : a[p], o);
    if ((v == null || v === '') && o && o.__norm) v = o.__norm[normKey(k)];
    if (v != null && v !== '') return v;
  }
  return '';
}
const toLocalDT = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
const truthy = v => v === true || /^(true|yes|y|1)$/i.test(String(v).trim());
const urlish = s => /^https?:\/\//i.test(String(s||'').trim()) ? String(s).trim() : '';
const ETP_URL = 'https://kagiso933.github.io/etender-pro/';
const SITE_URL = 'https://www.ryno-tec.co.za';
const ETP_MODE = {online:'Online','online and in person':'Online and in person','in person':'In person',none:'No briefing',unknown:'Not stated'};
const isEtp = r => r && typeof r.briefing === 'object' && r.briefing !== null && 'closingDate' in r && 'department' in r;
function fromEtp(r){
  const b = r.briefing || {};
  return {
    title: String(r.title || r.reference || '').replace(/\s+/g,' ').trim(), tenderNo: String(r.reference || ''),
    buyer: String(r.department || ''), province: String(r.province || ''), category: String(r.category || ''),
    value: r.value ? +r.value : null, closing: toLocalDT(r.closingDate),
    briefing: ETP_MODE[b.mode] || 'Not stated', compulsory: b.compulsory === true, briefingAt: toLocalDT(b.date),
    briefingVenue: String(b.venue || b.note || '').slice(0,500), briefingLink: urlish(b.link),
    sourceUrl: urlish(r.portalUrl), docsUrl: urlish((r.documents || [])[0]?.url), ocid: String(r.id || ''),
    _etp: true, _online: !!b.online,
    _text: [r.title, r.reference, r.category, (r.matchedTerms || []).join(' '), 'ict'].join(' ')
  };
}
function normTender(r){
  if (isEtp(r)) return fromEtp(r);
  const t = r.tender || {}, bs = t.briefingSession || r.briefingSession || {};
  let title = String(pick(r,'tender.title','title','tenderTitle') || '').trim();
  let desc = String(pick(r,'tender.description','description') || '').trim();
  let no = String(pick(r,'tenderNumber','tenderNo','bidNumber','tender.id','tenderId') || '').trim();
  if (desc && title && title.length <= 40 && /\d/.test(title) && desc.length > title.length){ no = title; title = desc; desc = ''; }
  if (!title) title = desc;
  const venue = String(pick(bs,'venue') || pick(r,'briefingVenue','briefingDetails','briefingSession') || '').trim();
  const bdate = pick(bs,'date') || pick(r,'briefingDate','briefingDateTime');
  const isSession = bs.isSession;
  const compRaw = bs.compulsory !== undefined ? bs.compulsory : pick(r,'briefingCompulsory','compulsoryBriefing','compulsory');
  const online = ONLINE_RE.test(venue) || truthy(pick(r,'onlineBriefing','virtualBriefing'));
  const physical = /\b\d{1,5}\s+\w+.*\b(street|st|road|rd|avenue|ave|drive|dr|boulevard)\b|boardroom|board room|auditorium|committee room|offices?\b|building/i.test(venue);
  let briefing = 'Not stated';
  if (isSession === false && !venue && !bdate) briefing = 'No briefing';
  else if (online && physical) briefing = 'Online and in person';
  else if (online) briefing = 'Online';
  else if (venue || bdate || isSession === true) briefing = 'In person';
  const docs = Array.isArray(t.documents) ? t.documents.map(d => d.url) : [];
  const docUrls = r.documentUrls || pick(r,'documentUrl','documentsUrl','documents') || docs;
  const cats = [pick(r,'tender.mainProcurementCategory','category','procurementCategory'), ...(Array.isArray(t.additionalProcurementCategories) ? t.additionalProcurementCategories : [])].filter(Boolean);
  const val = pick(r,'tender.value.amount','valueAmount','value','estimatedValue');
  return {
    title, tenderNo: no,
    buyer: String(pick(r,'buyer.name','tender.procuringEntity.name','buyerName','department','organOfState','entity') || ''),
    province: String(pick(r,'tender.province','province') || ''),
    category: cats.join(', '),
    value: val === '' ? null : (+String(val).replace(/[^\d.]/g,'') || null),
    closing: toLocalDT(pick(r,'tender.tenderPeriod.endDate','closingDate','closingDateTime','closing')),
    briefing, compulsory: truthy(compRaw), briefingAt: toLocalDT(bdate), briefingVenue: venue.slice(0,500),
    briefingLink: urlish((venue.match(/https?:\/\/\S+/) || [])[0]) || urlish(pick(r,'briefingLink','meetingLink')),
    sourceUrl: urlish(pick(r,'sourceUrl','url','link','tenderUrl')),
    docsUrl: urlish(Array.isArray(docUrls) ? docUrls[0] : docUrls),
    ocid: String(pick(r,'ocid') || ''),
    _text: [title, desc, cats.join(' '), no].join(' ')
  };
}
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(x => x.trim());
  return rows.filter(r => r.some(x => x.trim())).map(r => { const o = {}; head.forEach((k,i) => o[k] = r[i] ?? ''); o.__norm = {}; head.forEach((k,i) => o.__norm[normKey(k)] = r[i] ?? ''); return o; });
}
let importing = false;
async function importTenders(file){
  if (importing) return;
  let rows = [];
  try {
    const text = await file.text();
    if (/\.csv$/i.test(file.name) || /^[^{\[]/.test(text.trim())) rows = parseCSV(text);
    else {
      const j = JSON.parse(text);
      rows = Array.isArray(j) ? j : (j.releases || j.tenders || j.data || j.items || j.results || (j.records || []).map(r => r.compiledRelease || r) || []);
    }
    rows = rows.map(r => r && (r.compiledRelease || r)).filter(Boolean);
  } catch(e){ toast("Couldn't read that file. Use a JSON or CSV export from the tender system."); return; }
  const all = rows.map(normTender).filter(t => t.title);
  const etp = all.some(t => t._etp);
  const known = t => D.tenders.some(x => t.ocid && x.ocid === t.ocid);
  const it = etp ? all.filter(t => (t._online || known(t) || CO !== 'rtc') && (CO === 'rtc' || tenderRe().test(t._text))) : all.filter(t => tenderRe().test(t._text));
  if (!it.length){ toast(!all.length ? 'No tenders found in that file.' : etp && CO === 'rtc' ? `Read ${plural(all.length,'IT tender')}, but none has an online briefing.` : `Read ${plural(all.length,'tender')}, but none fit ${C().short}'s work.`); return; }
  importing = true; toast(`Importing ${plural(it.length,tn())}…`);
  let added = 0, updated = 0, failed = 0;
  for (const t of it){
    const {_text, _etp, _online, ...body} = t;
    const ex = D.tenders.find(x => (body.ocid && x.ocid === body.ocid) || (body.tenderNo && x.tenderNo === body.tenderNo && x.buyer === body.buyer));
    try {
      if (ex){
        const {id, ...old} = ex;
        await saveItem('tenders', id, {...old, ...body, status: old.status || 'New', notes: old.notes || '', briefingLink: old.briefingLink || body.briefingLink});
        updated++;
      } else { await saveItem('tenders', null, {...body, status:'New', notes:''}); added++; }
    } catch(e){ failed++; if (e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded')){ writeError(e); break; } }
  }
  importing = false;
  const online = it.filter(isOnline).length;
  toast(`${plural(added,'new ' + tn())}, ${updated} updated, ${online} with an online briefing${failed ? `, ${failed} failed` : ''}.`);
  ui.tenders.view = C().defView; render();
}
async function tenderToDeal(id){
  const t = get('tenders', id); if (!t) return;
  try {
    let client = D.clients.find(c => (c.name||'').trim().toLowerCase() === (t.buyer||'').trim().toLowerCase());
    const clientId = client ? client.id : await saveItem('clients', null, {name: t.buyer || 'Unknown buyer', industry:'Public sector', status:'Prospect', notes:''});
    const existing = D.deals.find(d => d.tender === id);
    if (existing){ dlg.close(); toast('This tender is already in the pipeline'); go('deals'); return; }
    await saveItem('deals', null, {title: t.title, client: clientId, tender: id, value: t.value || null, stage:'Qualified', probability:null, close: (t.closing||'').slice(0,10), service:'', notes: [t.tenderNo && 'Tender ' + t.tenderNo, t.sourceUrl].filter(Boolean).join('\n')});
    if (['New','Reviewing'].includes(t.status)){ const {id: _i, ...rest} = t; await saveItem('tenders', id, {...rest, status:'Bidding'}); }
    dlg.close(); toast('Added to pipeline and marked as bidding');
  } catch(e){ writeError(e); }
}

function sigParts(){
  const s = S(), bee = latestDoc('B-BBEE affidavit or certificate');
  const lvl = bee && docStatus(bee) !== 'Expired' ? ((bee.notes || '').match(/Level\s*(\d)/i) || [])[1] : '';
  const region = (s.address || '').split('\n').map(x => x.trim()).filter(x => x && !/^\d{4}$/.test(x)).slice(-1)[0];
  const legal = [s.sigReg && s.regNo && 'Reg. no. ' + s.regNo, s.vatRegistered && s.vatNo && 'VAT no. ' + s.vatNo, s.sigBee && lvl && `B-BBEE Level ${lvl} contributor`, region && region + ', South Africa'].filter(Boolean);
  const web = (s.website || '').replace(/^https?:\/\//, '');
  return {s, web, legal};
}
function signatureText(){
  const {s, web, legal} = sigParts();
  return [s.sigName, s.sigTitle, s.legalName || s.name, [s.mailAddress, s.phone, web].filter(Boolean).join(' | '), legal.join(' | ')].filter(Boolean).join('\n');
}

const LOGO_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="50 -10 320 320"><path d="M80 300 V80 H200 L240 120 V190 L200 230 H80" fill="none" stroke="#ffffff" stroke-width="40"/><path d="M155 230 L340 280" fill="none" stroke="#ffffff" stroke-width="40"/><path d="M146 12 H96 V60 H146" fill="none" stroke="#ffffff" stroke-width="28"/><path d="M254.1 226.4 L341.1 249.2" fill="none" stroke="#ff6b35" stroke-width="34"/><polygon points="313.6,245.9 351.2,136.4 347.6,134.6 281.6,229.7" fill="#ff6b35"/></svg>';
const LOGO_PNG = {};
function logoPng(){
  const co = CO, svg = C().logo || LOGO_SVG, bg = C().darkHex;
  if (LOGO_PNG[co]) return Promise.resolve(LOGO_PNG[co]);
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { try { const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, 160, 160); x.drawImage(img, 0, 0, 160, 160); LOGO_PNG[co] = c.toDataURL('image/jpeg', 0.9); } catch(e){ LOGO_PNG[co] = null; } res(LOGO_PNG[co]); };
    img.onerror = () => res(null);
    setTimeout(() => res(LOGO_PNG[co] || null), 2500);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

async function quotePdf(q){
  const s = S(), t = quoteTotals(q), {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', compress:true});
  const W = 210, L = 14, R = 196, logo = await logoPng(), DK = C().dark, AC = C().accent;
  const client = q.client ? get('clients', q.client) : null;
  const header = () => {
    doc.setFillColor(...DK); doc.rect(0, 0, W, 34, 'F');
    if (logo) doc.addImage(logo, 'JPEG', L, 7, 20, 20, 'logo-' + CO);
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(s.name, logo ? 38 : L, 16);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(203,213,225); doc.text(s.tagline || '', logo ? 38 : L, 22);
    doc.setTextColor(...AC); doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('QUOTATION', R, 16, {align:'right'});
    doc.setTextColor(255,255,255); doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.text(q.number, R, 23, {align:'right'});
    doc.setDrawColor(...AC); doc.setLineWidth(1.2); doc.line(0, 34, W, 34);
  };
  header();
  let y = 46;
  doc.setTextColor(51,51,51); doc.setFontSize(9);
  const from = [s.legalName || s.name, s.regNo && 'Reg. no. ' + s.regNo, s.vatRegistered && s.vatNo && 'VAT no. ' + s.vatNo, ...(s.address || '').split('\n'), s.publicEmail || s.mailAddress, s.phone, s.website].filter(Boolean);
  const to = [client?.name, q.contactName, ...emails(q.email)].filter(Boolean);
  doc.setFont('helvetica','bold'); doc.text('From', L, y); doc.text('Prepared for', 120, y);
  doc.setFont('helvetica','normal');
  from.forEach((l, i) => doc.text(String(l), L, y + 5 + i * 4.5));
  to.forEach((l, i) => doc.text(String(l), 120, y + 5 + i * 4.5));
  y += 8 + Math.max(from.length, to.length, 1) * 4.5;
  const tender = q.tender ? get('tenders', q.tender) : null, project = q.project ? get('projects', q.project) : null;
  const meta = [['Issued', fmtDate(q.issued)], ['Valid until', fmtDate(q.validUntil)], ['Reference', tender?.tenderNo || project?.name || '']].filter(m => m[1]);
  doc.setFillColor(245,245,245); doc.rect(L, y, R - L, 12, 'F');
  meta.forEach((m, i) => { const x = L + 4 + i * 62; doc.setFontSize(7.5); doc.setTextColor(102,102,102); doc.text(m[0].toUpperCase(), x, y + 4.5); doc.setFontSize(9.5); doc.setTextColor(26,26,26); doc.text(doc.splitTextToSize(m[1], 58)[0], x, y + 9.5); });
  y += 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(26,26,26);
  doc.splitTextToSize(q.title || 'Quotation', R - L).forEach(l => { doc.text(l, L, y); y += 6; });
  y += 2;
  const cols = {desc: L + 2, qty: 120, unit: 124, rate: 166, amt: R - 2};
  const thead = () => {
    doc.setFillColor(...DK); doc.rect(L, y, R - L, 8, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
    doc.text('Description', cols.desc, y + 5.4); doc.text('Qty', cols.qty, y + 5.4, {align:'right'}); doc.text('Unit', cols.unit, y + 5.4);
    doc.text('Rate', cols.rate, y + 5.4, {align:'right'}); doc.text('Amount', cols.amt, y + 5.4, {align:'right'});
    y += 8; doc.setFont('helvetica','normal'); doc.setTextColor(51,51,51); doc.setFontSize(9);
  };
  const ensure = h => { if (y + h > 272){ doc.addPage(); header(); y = 46; thead(); } };
  thead();
  q.items.filter(it => it.desc || +it.rate).forEach((it, i) => {
    const lines = doc.splitTextToSize(it.desc || '', 100), h = Math.max(lines.length * 4.4 + 4, 8);

            <span class="dname"><b>${esc(c.doc)}</b><span class="muted small">${esc(c.reference || '')}${c.expires ? ' · expires ' + esc(fmtDate(c.expires)) : ''}</span></span>
            ${badge(st)}${f ? viewBtn(f, 'Open') : `<button class="btn small" data-open="compliance:${c.id}">${ASSETS ? 'Add file' : 'Edit'}</button>`}</label></li>`; }).join('')}</ul>
          <div class="packbar"><span class="muted small">${sel.length ? `${plural(sel.length, 'document')} selected, ${kb(selBytes)}` : 'Tick documents to send them as a supplier pack.'}</span>
          <span class="spacer"></span><button class="btn" data-add="compliance">Add document</button><button class="btn primary" data-sendpack ${sel.length ? '' : 'disabled'}>Email supplier pack</button></div>`
          : empty('compliance', 'No documents yet. Add your CIPC certificate, tax PIN, CSD report and B-BBEE certificate.')}
      </section>
    </div>
    <div>
      <section class="panel"><h2>Legal deadlines</h2>${rows.length ? `<ul class="attn">${rows.map(r => { const d = daysUntil(r.w);
        return `<li><div class="dl"><span class="tag ${d < 0 ? 'bad' : d <= 30 ? '' : 'ok'}"></span><span><b>${esc(r.t)}</b><span class="muted small">${esc(r.n)}</span></span><span class="why">${esc(fmtDate(r.w))}<br>${d < 0 ? `<span class="late">${plural(-d, 'day')} overdue</span>` : d === 0 ? 'today' : 'in ' + plural(d, 'day')}</span></div></li>`; }).join('')}</ul>`
        : `<p class="muted">Add your registration date in <button class="link" data-edit-settings>Business details</button> to see CIPC and SARS deadlines.</p>`}
        <p class="muted small">Dates are worked out from your registration date and ${esc(s.yearEnd || 'October')} year end. Confirm tax dates with your accountant.</p></section>
    </div>
  </div>`;
}
async function blobToB64(blob){
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}
async function sendPack(){
  const sel = [...D.compliance].filter(c => PACK.has(c.id) && fileOf(c));
  if (!sel.length) return;
  const bytes = sel.reduce((a, c) => a + (fileOf(c).size || 0), 0);
  if (bytes > 3 * 1024 * 1024){ toast(`That's ${kb(bytes)}. Email from the hub takes about 3 MB of attachments, so untick a document and send the rest separately.`); return; }
  const s = S();
  const list = sel.map(c => `- ${c.doc}${c.reference ? ' (' + c.reference + ')' : ''}`).join('\n');
  openCompose({subject: `Supplier documents: ${s.legalName || s.name}`, body: `Good day,\n\nPlease find attached the supplier documents for ${s.legalName || s.name}:\n${list}\n\n${supplierText()}\n\n${s.signoff || ''}`, pack: sel.map(c => c.id)});
}
async function packAttachments(ids){
  const out = [];
  for (const id of ids){
    const c = get('compliance', id), f = fileOf(c); if (!f) continue;
    const r = await (f.sp && window.fetchHubFile ? fetchHubFile(f) : fetch(fileUrl(f))); if (!r.ok) throw {code: 'file_missing', message: `${c.doc} could not be loaded`};
    out.push({content: await blobToB64(await r.blob()), filename: f.name || (c.doc + '.pdf'), mimeType: f.type || 'application/pdf'});
  }
  return out;
}
async function uploadDocFile(input){
  const file = input.files && input.files[0]; if (!file) return;
  if (!ASSETS){ toast('Uploading needs the hub open inside Claude as its owner.'); return; }
  const types = ['application/pdf','image/png','image/jpeg','image/webp'];
  const type = types.includes(file.type) ? file.type : /\.pdf$/i.test(file.name) ? 'application/pdf' : '';
  if (!type){ toast('Upload a PDF or an image (PNG, JPG).'); input.value = ''; return; }
  const box = input.closest('.f'), lbl = box.querySelector('.fstate');
  lbl.textContent = 'Uploading…';
  try {
    const r = await ASSETS.upload(file, {type});
    box.querySelector('input[type=hidden]').value = JSON.stringify({id: r.id, name: file.name, size: r.sizeBytes, type: r.contentType, ...(r.sp ? {sp: true, driveId: r.driveId, itemId: r.itemId, webUrl: r.webUrl} : {})});
    lbl.innerHTML = `${viewBtn({id: r.id, name: file.name, type: r.contentType, size: r.sizeBytes}, file.name, 'link')} (${kb(r.sizeBytes)}). Save to keep it.`;
  } catch(e){
    lbl.textContent = e?.code === 'too_large' ? 'That file is over 20 MB.' : e?.code === 'quota_or_state' ? 'The hub’s file storage is full.' : 'Upload failed. Try again.';
  }
  input.value = '';
}
function bindPublic(){
  document.addEventListener('click', e => {
    if (e.target.closest('dialog')) return;
    if (e.target.closest('[data-copyprofile]')){
      const txt = supplierText();
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Supplier details copied')).catch(() => { openCompose({subject: 'Supplier details', body: txt}); });
      return;
    }
    if (e.target.closest('[data-sendpack]')) return sendPack();
  });
  document.addEventListener('change', e => {
    const p = e.target.closest('[data-pack]');
    if (p){ p.checked ? PACK.add(p.dataset.pack) : PACK.delete(p.dataset.pack); render(); }
  });
  document.addEventListener('change', e => { if (e.target.matches('[data-upload]')) uploadDocFile(e.target); }, true);
}

/* ---------- forms ---------- */
const dlg = $('#dlg'), form = $('#dlgForm');
let editing = null;
function fieldHTML(f, v){
  const id = 'f_' + f.k, req = f.req ? ' required' : '';
  const lab = `<label for="${id}">${esc(f.l)}${f.req ? ' <i aria-hidden="true">*</i>' : ''}</label>`;
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  const val = esc(v ?? '');
  let input;
  switch (f.t){
    case 'textarea': input = `<textarea id="${id}" name="${f.k}"${req}>${val}</textarea>`; break;
    case 'money': input = `<input id="${id}" name="${f.k}" type="number" min="0" step="any" inputmode="decimal" value="${val}"${req}>`; break;
    case 'number': input = `<input id="${id}" name="${f.k}" type="number" step="${f.step || 'any'}" min="0" inputmode="decimal" value="${val}"${req}>`; break;
    case 'select': input = `<select id="${id}" name="${f.k}"${req}><option value="">Choose…</option>${f.opt.map(o => `<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`; break;
    case 'ref': {
      const items = [...D[f.ref]].sort((a,b) => SCHEMA[f.ref].title(a).localeCompare(SCHEMA[f.ref].title(b)));
      input = `<select id="${id}" name="${f.k}"${req}><option value="">${items.length ? 'Choose…' : `No ${SCHEMA[f.ref].label.toLowerCase()} yet`}</option>${items.map(x => `<option value="${x.id}" ${x.id===v?'selected':''}>${esc(SCHEMA[f.ref].title(x))}</option>`).join('')}</select>`;
      break;
    }
    case 'asset': {
      let fv = null; if (v) { if (typeof v === 'object') fv = v; else { try { fv = JSON.parse(v); } catch(_){ fv = null; } } }
      return `<div class="f wide"><label>${esc(f.l)}</label><input type="hidden" name="${f.k}" value="${esc(fv ? JSON.stringify(fv) : '')}">
        <span class="fstate">${fv ? `${viewBtn(fv, fv.name || 'Open file', 'link')}${fv.size ? ' (' + kb(fv.size) + ')' : ''}` : 'No file yet'}</span>
        ${ASSETS ? '<input type="file" data-upload accept="application/pdf,image/png,image/jpeg,image/webp" aria-label="Upload file">' : '<span class="hint">Open the hub inside Claude as its owner to upload files.</span>'}</div>`;
    }
    case 'bool': return `<div class="f check"><input id="${id}" name="${f.k}" type="checkbox" ${v ? 'checked' : ''}><label for="${id}">${esc(f.l)}</label></div>`;
    default: input = `<input id="${id}" name="${f.k}" type="${f.t}" value="${val}"${req}>`;
  }
  return `<div class="f ${f.wide || f.t === 'textarea' ? 'wide' : ''}">${lab}${input}${hint}</div>`;
}
function openForm(k, id, prefill){
  if (k === 'quotes') return openQuote(id, prefill);
  const s = SCHEMA[k];
  let item;
  if (id) item = get(k,id);
  if (id && !item) return toast('That record no longer exists.');
  if (!item){
    item = {};
    s.fields.forEach(f => { if (f.def !== undefined) item[f.k] = typeof f.def === 'function' ? f.def() : f.def; });
    Object.assign(item, prefill || {});
  }
  editing = {k, id};
  const meta = id && item.updatedAt ? `<span class="meta">Updated ${new Date(item.updatedAt).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'})}</span>` : '';
  const open = k === 'projects' && id && route().page !== 'project' ? `<button type="button" class="btn" data-goproj="${id}">Open project</button>` : '';
  const lnk = (u, l) => u && /^https?:\/\//i.test(u) ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>` : '';
  let doc = k === 'contracts' ? lnk(item.doc,'Open document') : k === 'compliance' ? lnk(item.link,'Open document') : '';
  if (k === 'clients' && id && emails(item.email).length) doc = `<button type="button" class="btn" data-compose-to="${esc(emails(item.email).join(', '))}">Email</button><button type="button" class="btn" data-quote-client="${id}">New quote</button>`;
  if (k === 'archive') doc = lnk(item.gmailUrl,'Open email');
  const extra = k === 'archive' && (item.attachments || []).length ? `<div class="f wide"><label>Attachments</label><div class="row-btns">${item.attachments.map(f => viewBtn(f, f.name || 'Open', 'btn small')).join('')}</div></div>` : '';
  if (k === 'tenders' && id) doc = lnk(item.briefingLink,'Join briefing') + (item.ocid ? lnk(ETP_URL + '#tender=' + encodeURIComponent(item.ocid) + '&tab=bid','Build bid in eTender Pro') : '') + lnk(item.docsUrl,'Bid documents') + lnk(item.sourceUrl,'Open on eTenders') + `<button type="button" class="btn" data-todeal="${id}">Add to pipeline</button>`;
  form.innerHTML = `<div class="dhead"><h2>${id ? esc(s.title(item) || 'Edit ' + s.one) : 'New ' + esc(s.one)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
  <div class="fields">${extra}${s.fields.map(f => fieldHTML(f, item[f.k])).join('')}</div>
  <div class="dfoot">${id ? `<button type="button" class="btn danger" data-del>Delete</button>` : ''}${open}${doc}${meta}<span class="spacer"></span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">${id ? 'Save changes' : 'Add ' + esc(s.one)}</button></div>`;
  if (k === 'contributions'){
    const p = form.querySelector('[name=partner]'), a = form.querySelector('[name=amount]');
    const fill = () => { if (!a.value && p.value){ const pt = get('partners',p.value); if (pt?.commitment) a.value = pt.commitment; } };
    p.addEventListener('change', fill); fill();
  }
  if (!dlg.open) dlg.showModal();
  const first = form.querySelector('.fields input, .fields select, .fields textarea');
  if (first && !id) first.focus();
}
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!form.checkValidity()){ form.reportValidity(); return; }
  const {k, id} = editing, s = SCHEMA[k], fd = new FormData(form), body = {};
  s.fields.forEach(f => {
    if (f.t === 'bool') body[f.k] = form.querySelector(`[name="${f.k}"]`).checked;
    else if (f.t === 'money' || f.t === 'number'){ const v = fd.get(f.k); body[f.k] = v === '' ? null : +v; }
    else if (f.t === 'asset'){ const v = fd.get(f.k); try { body[f.k] = v ? JSON.parse(v) : null; } catch(_){ body[f.k] = null; } }
    else body[f.k] = (fd.get(f.k) || '').toString().trim();
  });
  if (k === 'requirements' && !body.ref){
    const n = D.requirements.filter(r => r.project === body.project).map(r => +(String(r.ref||'').match(/(\d+)$/)||[])[1] || 0);
    body.ref = 'REQ-' + String((n.length ? Math.max(...n) : 0) + 1).padStart(3,'0');
  }
  if (k === 'archive' && id){ const old = get(k, id) || {}; ['attachments','threadId','gmailId'].forEach(x => { if (old[x] !== undefined) body[x] = old[x]; }); }
  if (k === 'timesheets' && body.partner) lsSet('ops-me', body.partner);
  if (k === 'invoices' && body.status === 'Paid' && !body.paidOn) body.paidOn = today();
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    await saveItem(k, id, body);
    dlg.close();
    toast(id ? 'Changes saved' : `${s.one[0].toUpperCase() + s.one.slice(1)} added`);
  } catch(err){ writeError(err); }
  finally { btn.disabled = false; }
});
form.addEventListener('click', async e => {
  if (e.target.closest('[data-close]')) return dlg.close();
  const ct = e.target.closest('[data-compose-to]');
  if (ct){ dlg.close(); return openCompose({to: ct.dataset.composeTo}); }

  if (qc){ const c = get('clients', qc.dataset.quoteClient); dlg.close(); return openQuote(null, {client: qc.dataset.quoteClient, email: emails(c?.email).join(', '), contactName: c?.contact || ''}); }
  const td = e.target.closest('[data-todeal]');

  if (gp){ dlg.close(); go('project/' + gp.dataset.goproj); return; }

    catch(err){ writeError(err); }
  }
});
